<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Needle & Thread</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {font-family:sans-serif; background:#fafafa;}

    nav {
      position:fixed;
      top:0; left:0; width:100%;
      background: rgba(240,240,240,0.9);
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 20px;
      z-index:1000;
    }

    .logo {font-size:1.5em; font-weight:bold; text-decoration:none; color:#333;}

    .nav-actions {
      display:flex; align-items:center; gap:15px;
    }

    .search-bar {
      padding:5px 10px; border:1px solid #ccc; border-radius:5px;
    }

    .icon {font-size:18px; text-decoration:none; color:#333;}

    .nav-links {
      list-style:none;
      display:flex; gap:20px;
      align-items:center;
    }

    .nav-links li {position:relative;}
    .nav-links li a {
      text-decoration:none;
      color:#333;
      padding:8px 12px;
      display:block;
    }

    .nav-links li ul {
      display:none;
      position:absolute;
      top:100%;
      left:0;
      background:#222;
      list-style:none;
      min-width:150px;
      z-index:2000;
    }

    .nav-links li ul li a {
      color:white;
      padding:10px 15px;
    }

    .nav-links li ul li a:hover {
      background:#FF6347;
    }

    .nav-links li:hover ul {
      display:block;
    }

    .burger {
      display:none;
      flex-direction:column;
      gap:5px;
      cursor:pointer;
    }

    .burger div {
      width:25px;
      height:3px;
      background:#333;
      border-radius:2px;
    }

    @media (max-width: 768px) {
      .burger {display:flex;}
      .nav-links {
        position:fixed;
        top:0; right:-100%;
        flex-direction:column;
        justify-content:flex-start;
        align-items:start;
        background:rgba(0,0,0,0.95);
        height:100vh;
        width:250px;
        padding:60px 20px;
        gap:15px;
        transition:right 0.3s ease;
      }
      .nav-links.active { right:0; }
      .nav-links li ul {
        position:static;
        background:none;
        display:none;
      }
      .nav-links li.show ul {
        display:block;
      }
      .nav-links li a {
        color:white;
        padding:8px 10px;
      }
      .nav-links li ul li a {
        color:white;
      }
    }

    footer {
      background:#222;
      color:white;
      padding:20px;
      text-align:center;
    }

    .footer-links a {
      color:#aaa;
      margin:0 10px;
      text-decoration:none;
      cursor:pointer;
    }
    .footer-links a:hover {
      text-decoration:underline;
    }

    /* Modal styles */
    #modal {
      display:none;
      position:fixed;
      top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.7);
      justify-content:center;
      align-items:center;
      z-index:3000;
    }

    .modal-content {
      background:#fff;
      padding:20px;
      border-radius:10px;
      text-align:center;
      width:80%; max-width:400px;
    }

    .close-btn {
      background:#333; color:white;
      padding:5px 10px;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-top:10px;
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="logo">Needle & Thread</a>
  <div class="burger" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </div>
  <ul class="nav-links" id="navLinks">
    <li>
      <a href="#" onclick="toggleSubmenu(event)">Men</a>
      <ul>
        <li><a href="#">Streetwear</a></li>
        <li><a href="#">Casualwear</a></li>
        <li><a href="#">Athleisure</a></li>
      </ul>
    </li>
    <li>
      <a href="#" onclick="toggleSubmenu(event)">Women</a>
      <ul>
        <li><a href="#">Streetwear</a></li>
        <li><a href="#">Casualwear</a></li>
        <li><a href="#">Athleisure</a></li>
      </ul>
    </li>
    <li><a href="#">Kids</a></li>
    <li><a href="#">Sale</a></li>
  </ul>
  <div class="nav-actions">
    <input type="text" class="search-bar" placeholder="Search...">
    <a href="#" class="icon">♡</a>
    <a href="#" class="icon">👤</a>
  </div>
</nav>

<header style="height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;color:white;background:url('https://images.unsplash.com/photo-1503342217505-b0a15ec3261c') center/cover;">
  <h1>Welcome to Needle & Thread</h1>
</header>

<footer>
  <div class="footer-links">
    <a href="#">About Us</a>
    <a href="#">My Account</a>
    <a href="#">Size Chart</a>
    <a href="#">FAQs</a>
    <a href="#">Rewards</a>
    <a href="#">Shipping Policy</a>
    <a href="#">Returns Policy</a>
    <a href="#">Privacy Policy</a>
    <a href="#">T&Cs</a>
    <a href="#">Contact Us</a>
  </div>
</footer>

<div id="modal">
  <div class="modal-content">
    <h2 id="modal-title"></h2>
    <p id="modal-content-text"></p>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
function toggleMenu() {
  const nav = document.getElementById('navLinks');
  nav.classList.toggle('active');
}

function toggleSubmenu(event) {
  if (window.innerWidth <= 768) {
    event.preventDefault();
    let parent = event.target.parentElement;
    parent.classList.toggle('show');
  }
}

const contentMap = {
  "About Us": "We are Needle & Thread — where style meets comfort. Our mission is to bring premium fashion directly to your wardrobe!",
  "My Account": "Manage your profile, check orders, update preferences and access exclusive offers right here.",
  "Size Chart": "Our sizes are true to fit! Refer to the size chart on product pages to pick your perfect fit.",
  "FAQs": "Got questions? We've answered the most common ones for you on our FAQ page!",
  "Rewards": "Earn points every time you shop with us! Redeem them for exciting discounts.",
  "Shipping Policy": "We offer reliable shipping globally. Your style will arrive safe and sound!",
  "Returns Policy": "Not satisfied? Easy 7-day returns on all items. Customer happiness is our priority!",
  "Privacy Policy": "Your data is safe with us. Read about how we protect your personal info here.",
  "T&Cs": "Please read our terms and conditions for a smooth shopping experience.",
  "Contact Us": "Need help? Reach out to our team via email or live chat anytime."
};

document.querySelectorAll('.footer-links a').forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    const title = e.target.innerText.trim();
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-content-text').innerText = contentMap[title] || "Coming soon!";
    document.getElementById('modal').style.display = 'flex';
  });
});

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
</script>

</body>
</html>
