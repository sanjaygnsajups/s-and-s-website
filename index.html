<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Needle & Thread</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: #fafafa;
            color: #333;
        }

        nav {
            position: fixed;
            width: 100%;
            background: rgba(34, 34, 34, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 1.6em;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links li a {
            text-decoration: none;
            color: white;
            font-size: 1em;
            transition: color 0.3s ease;
        }

        .nav-links li a:hover {
            color: #FFD700;
        }

        .nav-links li ul {
            display: none;
            position: absolute;
            top: 30px;
            left: 0;
            background: rgba(34, 34, 34, 0.95);
            padding: 10px 0;
            list-style: none;
        }

        .nav-links li:hover ul {
            display: block;
        }

        .nav-links li ul li a {
            display: block;
            padding: 8px 20px;
            white-space: nowrap;
        }

        .burger {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 4px;
        }

        .burger div {
            width: 25px;
            height: 3px;
            background: white;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 60px;
                right: -100%;
                background: rgba(34, 34, 34, 0.95);
                height: 100vh;
                width: 200px;
                flex-direction: column;
                align-items: center;
                justify-content: start;
                gap: 30px;
                padding-top: 20px;
                transition: 0.3s ease;
            }

            .nav-links.active {
                right: 0;
            }

            .burger {
                display: flex;
            }

            .nav-links li ul {
                position: static;
            }
        }

        header {
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1503342217505-b0a15ec3261c') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 3.5em;
        }

        header p {
            font-size: 1.2em;
            max-width: 600px;
            margin-top: 20px;
        }

        .social-icons {
            margin-left: 20px;
            display: flex;
            gap: 10px;
        }

        .social-icons a {
            color: white;
            font-size: 1.2em;
            text-decoration: none;
        }

        .social-icons a:hover {
            color: #FFD700;
        }

    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">Needle & Thread</a>
    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li>
            <a href="#">Men</a>
            <ul>
                <li><a href="#">Streetwear</a></li>
                <li><a href="#">Casualwear</a></li>
                <li><a href="#">Athleisure</a></li>
            </ul>
        </li>
        <li>
            <a href="#">Women</a>
            <ul>
                <li><a href="#">Streetwear</a></li>
                <li><a href="#">Casualwear</a></li>
                <li><a href="#">Athleisure</a></li>
            </ul>
        </li>
        <li><a href="#">Kids</a></li>
        <li><a href="#">Sale</a></li>
    </ul>
    <div class="social-icons">
        <a href="#">&#x1F4F7;</a>
        <a href="#">&#x1F4F1;</a>
        <a href="#">&#x1F426;</a>
    </div>
    <div class="burger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
    </div>
</nav>

<header>
    <h1>Needle & Thread</h1>
    <p>For your Everyday Fashion! Premium quality meets timeless style — shop now!</p>
</header>

<script>
    function toggleMenu() {
        document.querySelector('.nav-links').classList.toggle('active');
    }
</script>

</body>
</html>
