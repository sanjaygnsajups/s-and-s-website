<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Needle & Thread</title>
    <style>
        body { font-family: 'Lato', sans-serif; margin: 0; background: #fafafa; }
        header { background: rgba(34,34,34,0.9); color: white; padding: 20px; text-align: center; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h4 {
            margin: 0 0 10px;
            font-size: 1.1em;
        }

        .product-info p {
            margin: 0 0 15px;
            font-size: 0.9em;
            color: #555;
        }

        .product-info button {
            background: #FF6347;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .product-info button:hover {
            background: #FF4500;
        }

        footer {
            background: rgba(34,34,34,0.9);
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>Our Products</h1>
    <p>Premium quality apparel designed for comfort and style.</p>
</header>

<section class="product-grid">
    <div class="product-card">
        <img src="https://via.placeholder.com/300x300?text=Men+Tee" alt="Men T-Shirt">
        <div class="product-info">
            <h4>Classic Men's Tee</h4>
            <p>$19.99</p>
            <button onclick="addToCart('Classic Men\'s Tee', 19.99)">Add to Cart</button>
        </div>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/300x300?text=Women+Top" alt="Women Top">
        <div class="product-info">
            <h4>Stylish Women's Top</h4>
            <p>$24.99</p>
            <button onclick="addToCart('Stylish Women\'s Top', 24.99)">Add to Cart</button>
        </div>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/300x300?text=Kids+Hoodie" alt="Kids Hoodie">
        <div class="product-info">
            <h4>Cozy Kids Hoodie</h4>
            <p>$29.99</p>
            <button onclick="addToCart('Cozy Kids Hoodie', 29.99)">Add to Cart</button>
        </div>
    </div>
</section>

<footer>
    &copy; 2025 Needle & Thread. All Rights Reserved.
</footer>

<script>
    function addToCart(productName, price) {
        alert(`${productName} has been added to your cart!`);
        // Future: Connect this to backend/localStorage.
    }
</script>

</body>
</html>
